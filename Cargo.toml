[package]
name = "pass-secret-service"
version = "0.7.0"
edition = "2021"

[lib]
name = "pass_secret_service"
path = "src/lib.rs"

[[bin]]
name = "pass-secret-service"
path = "src/main.rs"

[[bin]]
name = "alohomora-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "alohomora-local-device"
path = "src/bin/local_device.rs"

[[bin]]
name = "alohomora-unlock"
path = "src/bin/unlock.rs"

[dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
argh = "0.1.13"
argon2 = "0.5"
async-trait = "0.1.89"
axum = { version = "0.7.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bs58 = "0.5.1"
cbc = { version = "0.1.2", features = ["std"] }
cuid2 = "0.1.6"
dyn-clone = "1.0.20"
env_logger = "0.11.8"
futures-util = "0.3.30"
hkdf = { version = "0.12.4", features = ["std"] }
jiff = { version = "0.2.19", default-features = false, features = ["perf-inline", "std", "tz-system"] }
libc = "0.2.155"
log = "0.4.27"
nanoid = "0.4.0"
num = { version = "0.4.3", features = ["rand"] }
rand = "0.8.5"
qrcode = { version = "0.14.1", default-features = false }
redb = "2.1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rsa = { version = "0.9.10", features = ["sha2"] }
schemars = "0.8.22"
secure-types = { version = "0.2.40", features = ["serde"] }
serde = "1.0.204"
serde_json = "1.0.145"
sha1 = "0.10"
sha2 = "0.10.9"
sysinfo = { version = "0.38.0", default-features = false, features = ["system"] }
thiserror = "2.0.12"
tokio = { version = "1.38.1", features = ["fs", "rt", "rt-multi-thread", "macros", "net", "process", "sync", "time"] }
zeroize = "1"
uuid = { version = "1.11.0", features = ["v4"] }
zbus = { version = "4.3.1", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.38.1", features = ["test-util"] }

[profile.release]
strip = true
opt-level = "z"
lto = true

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0

# RSA key generation is far too slow unoptimised (seconds per request), which
# makes D-Bus integration tests time out under load.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3
